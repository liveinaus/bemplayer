name: Format

# Runs the formatter against the private source and hands back a patch.
#
# Development happens on a machine that cannot run the Android toolchain, so
# spotlessApply cannot run there. This produces the diff as an artifact rather
# than pushing it, which keeps the source token read only.
#
# Drive it from the source repo with scripts/format.sh.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag or commit in the source repo'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: liveinaus/bemplayer-code
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply the formatter
        run: gradle spotlessApply

      - name: Produce the patch
        id: patch
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Already formatted, nothing to send back."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached > format.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Files the formatter changed:"
          git diff --cached --name-only

      - name: Upload the patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
          retention-days: 3
