name: Release

# Builds run here, in the public repo, so they do not consume the private
# repo's Actions minutes. The source is checked out from the private repo with
# a read only token.
#
# Note that logs for this workflow are public. A failing build prints source
# paths and snippets, so treat that as the cost of building here.

on:
  push:
    tags:
      - 'v*'
      # The dev channel. Published as a prerelease, and never put on the front page.
      - 'dev-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v, for example 0.2.0'
        required: true
      channel:
        description: 'Which channel to publish to'
        required: false
        default: stable
        type: choice
        options:
          - stable
          - dev
      source_ref:
        description: 'Branch, tag or commit in the source repo'
        required: false
        default: 'main'
      notes:
        description: 'Release notes. Leave empty to take them from the tag'
        required: false

permissions:
  contents: write

# Two releases at once would race on the update manifest.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SOURCE_REPO: liveinaus/bemplayer-code

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: public

      - name: Work out version and source ref
        id: version
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            SOURCE_REF="$INPUT_SOURCE_REF"
            CHANNEL="${INPUT_CHANNEL:-stable}"
          else
            case "$GITHUB_REF_NAME" in
              dev-*)
                CHANNEL="dev"
                VERSION="${GITHUB_REF_NAME#dev-}"
                ;;
              *)
                CHANNEL="stable"
                VERSION="${GITHUB_REF_NAME#v}"
                ;;
            esac
            SOURCE_REF=""
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be major.minor.patch, got '$VERSION'"
            exit 1
          fi

          # major*10000 + minor*100 + patch, so 0.1.0 is 100 and every later
          # release compares greater. Minor and patch must stay below 100. A dev
          # build shares the code of the release it precedes; what tells the two
          # apart is the name it carries.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          if [ "$CHANNEL" = "dev" ]; then
            TAG="dev-$VERSION"
            BUILD_VERSION="$VERSION-dev"
          else
            TAG="v$VERSION"
            BUILD_VERSION="$VERSION"
          fi

          # Prefer a matching tag in the source repo, so a release is always
          # reproducible. Fall back to main when only this repo was tagged.
          if [ -z "$SOURCE_REF" ]; then
            if git ls-remote --tags "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git" "refs/tags/${TAG}" | grep -q .; then
              SOURCE_REF="$TAG"
            else
              SOURCE_REF="main"
            fi
          fi

          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "source_ref=$SOURCE_REF"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "build_version=$BUILD_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $BUILD_VERSION (build $VERSION_CODE) from $SOURCE_REPO@$SOURCE_REF"

      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: liveinaus/bemplayer-code
          ref: ${{ steps.version.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      # Format, lint, typecheck and the unit tests: the same gate a workstation
      # runs, so a release is never published on code that would fail locally.
      - name: Checks
        working-directory: source
        run: npm run check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle wrapper in android/ decides the version; this is for caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The APK is a shell around the web app, and cap sync is what copies it in
      # and writes the plugin project the Gradle build depends on.
      - name: Build the web app
        working-directory: source
        run: |
          npm run build
          npx cap sync android

      - name: Build signed APKs
        working-directory: source
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          JKS="$RUNNER_TEMP/release.jks"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Every release must be signed with the same key or the app cannot update itself."
            exit 1
          fi

          # Strip any wrapping so both GNU and BSD base64 output decode cleanly.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$JKS"

          if [ ! -s "$JKS" ]; then
            echo "::error::The decoded keystore is empty. Re-create KEYSTORE_BASE64 with: openssl base64 -A -in your.jks"
            exit 1
          fi

          # Checked through the same calls the packaging step makes, because keytool
          # ignores -keypass on a PKCS12 keystore and so passes a key password that
          # Gradle then rejects. Reads its input from the environment, never argv.
          cat > "$RUNNER_TEMP/KeyCheck.java" <<'JAVA'
          import java.io.File;
          import java.security.KeyStore;
          import java.util.Collections;

          // 10 the store did not open, 11 no such alias, 12 the key did not decrypt.
          public class KeyCheck {
              public static void main(String[] args) {
                  String alias = System.getenv("CHECK_ALIAS");
                  String keyPassword = System.getenv("CHECK_KEY_PASSWORD");
                  KeyStore keyStore;
                  try {
                      keyStore =
                          KeyStore.getInstance(
                              new File(System.getenv("CHECK_KEYSTORE")),
                              System.getenv("CHECK_STORE_PASSWORD").toCharArray());
                  } catch (Exception e) {
                      System.err.println(e.getClass().getSimpleName() + ": " + e.getMessage());
                      System.exit(10);
                      return;
                  }
                  System.out.println(keyStore.getType());
                  if (alias == null || alias.isEmpty()) {
                      return;
                  }
                  try {
                      if (!keyStore.containsAlias(alias)) {
                          System.err.println("Aliases present: " + Collections.list(keyStore.aliases()));
                          System.exit(11);
                          return;
                      }
                      if (keyPassword == null || keyPassword.isEmpty()) {
                          return;
                      }
                      if (keyStore.getKey(alias, keyPassword.toCharArray()) == null) {
                          System.err.println("No key under that alias.");
                          System.exit(12);
                      }
                  } catch (Exception e) {
                      System.err.println(e.getClass().getSimpleName() + ": " + e.getMessage());
                      System.exit(12);
                  }
              }
          }
          JAVA

          # $1 store password, $2 alias or empty, $3 key password or empty.
          check() {
            CHECK_KEYSTORE="$JKS" CHECK_STORE_PASSWORD="$1" CHECK_ALIAS="$2" CHECK_KEY_PASSWORD="$3" \
              java "$RUNNER_TEMP/KeyCheck.java"
          }
          code() { check "$@" >/dev/null 2>&1 || echo $?; }

          # A secret pasted into the browser usually keeps a trailing newline, and a
          # backslash pasted into a properties file used to be eaten by Java's escaping.
          # Neither is visible in a secret, so try the value as given, then trimmed, and
          # say which one worked. The trimmed value is masked before it is ever used.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          STORE_PASSWORD="$KEYSTORE_PASSWORD"
          if [ "$(code "$STORE_PASSWORD" '' '')" = 10 ]; then
            TRIMMED="$(trim "$KEYSTORE_PASSWORD")"
            echo "::add-mask::$TRIMMED"
            if [ "$TRIMMED" != "$KEYSTORE_PASSWORD" ] && [ -z "$(code "$TRIMMED" '' '')" ]; then
              echo "::warning::KEYSTORE_PASSWORD has whitespace around it. Using the trimmed value, but re-save the secret without it."
              STORE_PASSWORD="$TRIMMED"
            else
              echo "::error::KEYSTORE_PASSWORD does not open the keystore. Java said:"
              check "$STORE_PASSWORD" '' '' 2>&1 >/dev/null | sed 's/^/::error::/' || true
              exit 1
            fi
          fi
          echo "The keystore opens. Type: $(check "$STORE_PASSWORD" '' '')"

          ALIAS="$KEY_ALIAS"
          if [ "$(code "$STORE_PASSWORD" "$ALIAS" '')" = 11 ]; then
            TRIMMED="$(trim "$KEY_ALIAS")"
            echo "::add-mask::$TRIMMED"
            if [ "$TRIMMED" != "$KEY_ALIAS" ] && [ -z "$(code "$STORE_PASSWORD" "$TRIMMED" '')" ]; then
              echo "::warning::KEY_ALIAS has whitespace around it. Using the trimmed value, but re-save the secret without it."
              ALIAS="$TRIMMED"
            else
              echo "::error::KEY_ALIAS is not in this keystore."
              check "$STORE_PASSWORD" "$ALIAS" '' 2>&1 >/dev/null | sed 's/^/::error::/' || true
              exit 1
            fi
          fi
          echo "The alias is present."

          # A PKCS12 keystore cannot hold a key password of its own, so there the store
          # password is the key password however the secret is set. An empty secret means
          # the same thing: return was pressed at the key password prompt.
          KEY_PASS="${KEY_PASSWORD:-}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$STORE_PASSWORD"
          fi
          if [ -n "$(code "$STORE_PASSWORD" "$ALIAS" "$KEY_PASS")" ]; then
            RESOLVED=""
            for CANDIDATE in "$(trim "$KEY_PASS")" "$STORE_PASSWORD"; do
              echo "::add-mask::$CANDIDATE"
              if [ "$CANDIDATE" != "$KEY_PASS" ] && [ -z "$(code "$STORE_PASSWORD" "$ALIAS" "$CANDIDATE")" ]; then
                RESOLVED="$CANDIDATE"
                break
              fi
            done
            if [ -n "$RESOLVED" ]; then
              echo "::warning::KEY_PASSWORD as stored does not decrypt the key, but a trimmed value or the store password does. Re-save the secret to match."
              KEY_PASS="$RESOLVED"
            else
              echo "::error::KEY_PASSWORD cannot decrypt the key. That is what 'Given final block not properly padded' means in the packaging step."
              echo "::error::Note that keytool cannot check this for a PKCS12 keystore, where it ignores -keypass. Java said:"
              check "$STORE_PASSWORD" "$ALIAS" "$KEY_PASS" 2>&1 >/dev/null | sed 's/^/::error::/' || true
              exit 1
            fi
          fi
          echo "The key decrypts. Signing material is good."

          # Passed through the environment rather than keystore.properties, because a
          # properties file applies Java's escaping rules to the passwords. They stay
          # inside this step so they are never written to an output or to the workspace.
          export BEMPLAYER_KEYSTORE="$JKS"
          export BEMPLAYER_KEYSTORE_PASSWORD="$STORE_PASSWORD"
          export BEMPLAYER_KEY_ALIAS="$ALIAS"
          export BEMPLAYER_KEY_PASSWORD="$KEY_PASS"

          # The update manifest URL is no longer a build constant: the app reads
          # it from src/update/manifest.ts, which points at this repo's releases.
          ./android/gradlew -p android :app:assembleRelease \
            -PrequireSigning=true \
            -PversionName='${{ steps.version.outputs.build_version }}' \
            -PversionCode='${{ steps.version.outputs.version_code }}'

      - name: Collect release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/notes.md"

          # Notes come from the first of these that has anything in it: the
          # workflow input, the tag in this repo, then the matching tag in the
          # source repo, which is where an annotated tag is usually written.
          read_tag_body() {
            git -C "$1" tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" 2>/dev/null || true
          }

          has_text() {
            [ -n "$(printf '%s' "$1" | tr -d '[:space:]')" ]
          }

          if has_text "${INPUT_NOTES:-}"; then
            printf '%s\n' "$INPUT_NOTES" > "$NOTES_FILE"
          elif has_text "$(read_tag_body public)"; then
            read_tag_body public > "$NOTES_FILE"
          elif has_text "$(read_tag_body source)"; then
            read_tag_body source > "$NOTES_FILE"
          else
            echo "See the commit history for what changed in this build." > "$NOTES_FILE"
          fi

          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "Release notes:"
          cat "$NOTES_FILE"

      - name: Generate APK names, manifest and front page
        id: assets
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          python3 source/scripts/release_assets.py \
            --apk-dir source/android/app/build/outputs/apk/release \
            --out-dir "$RUNNER_TEMP/assets" \
            --template source/docs/release-readme-template.md \
            --version '${{ steps.version.outputs.version }}' \
            --version-code '${{ steps.version.outputs.version_code }}' \
            --channel '${{ steps.version.outputs.channel }}' \
            --repo '${{ github.repository }}' \
            --source-sha "$SOURCE_SHA" \
            --notes-file '${{ steps.notes.outputs.path }}'
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'

          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version or delete that release first."
            exit 1
          fi

          # A dev build is a prerelease, which is what keeps it out of the
          # releases/latest URL that every stable install reads.
          PRERELEASE=""
          if [ '${{ steps.version.outputs.channel }}' = 'dev' ]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE="--latest"
          fi

          gh release create "$TAG" \
            --repo '${{ github.repository }}' \
            $PRERELEASE \
            --title "Bemplayer ${{ steps.version.outputs.build_version }}" \
            --notes-file '${{ steps.notes.outputs.path }}' \
            "$RUNNER_TEMP"/assets/*.apk \
            "$RUNNER_TEMP/assets/update.json"

      # Only now do the download URLs in the manifest resolve, so this comes
      # after the release is published, never before.
      # Stable only. The front page tells someone arriving at the repo what to
      # download, and that is never a dev build.
      - name: Update the front page and the update manifest
        if: steps.version.outputs.channel == 'stable'
        working-directory: public
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/assets/update.json" update.json
          cp "$RUNNER_TEMP/assets/README.md" README.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json README.md

          if git diff --cached --quiet; then
            echo "Nothing changed on the front page."
            exit 0
          fi

          git commit -m "Publish ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main

      - name: Tag the source commit
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Traceability only, so a failure here must not fail the release.
          # It is skipped when the source was already tagged.
          if [ '${{ steps.version.outputs.source_ref }}' = '${{ steps.version.outputs.tag }}' ]; then
            echo "Source was already tagged."
            exit 0
          fi
          git -C source tag '${{ steps.version.outputs.tag }}' '${{ steps.assets.outputs.source_sha }}'
          git -C source push "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git" '${{ steps.version.outputs.tag }}'

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Bemplayer ${{ steps.version.outputs.build_version }} (${{ steps.version.outputs.channel }})"
            echo
            echo "- Build ${{ steps.version.outputs.version_code }}"
            echo "- Source \`${{ env.SOURCE_REPO }}@${{ steps.version.outputs.source_ref }}\`"
            echo "- Release https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
