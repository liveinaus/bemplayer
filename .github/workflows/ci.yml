name: CI

# The source lives in a private repo, which cannot trigger this workflow without
# spending its Actions minutes. So CI runs on demand and on a weekly sweep.
# Trigger it for a specific commit with:
#   gh workflow run ci.yml --repo liveinaus/bemplayer -f source_ref=<sha>
# The release workflow runs the same tests before it builds, so a release is
# never published on untested code.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag or commit in the source repo'
        required: false
        default: 'main'
  schedule:
    # 19:00 UTC Sunday, which is Monday morning in Australia.
    - cron: '0 19 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: liveinaus/bemplayer-code

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: liveinaus/bemplayer-code
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Format, lint, typecheck and the unit tests, in that order.
      - name: Checks
        run: npm run check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle wrapper in android/ decides the version; this is for caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Proves the APK still assembles. The web app has to be built first: the
      # native project packages dist/, and cap sync writes the plugin project.
      - name: Build the web app
        run: |
          npm run build
          npx cap sync android

      # The slim flavour only: the webview flavour needs Google's WebView as an
      # asset, which is fetched for a release and is not what this check is
      # about. The unit tests are the native side's own, such as the user
      # agent parse the pre-flight screen depends on.
      - name: Assemble debug and run the native unit tests
        run: ./android/gradlew -p android :app:assembleSlimDebug :app:testSlimDebugUnitTest
