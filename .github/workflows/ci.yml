name: CI

# The source lives in a private repo, which cannot trigger this workflow without
# spending its Actions minutes. So CI runs on demand and on a weekly sweep.
# Trigger it for a specific commit with:
#   gh workflow run ci.yml --repo liveinaus/bemplayer -f source_ref=<sha>
# The release workflow runs the same tests before it builds, so a release is
# never published on untested code.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag or commit in the source repo'
        required: false
        default: 'main'
  schedule:
    # 19:00 UTC Sunday, which is Monday morning in Australia.
    - cron: '0 19 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: liveinaus/bemplayer-code

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: liveinaus/bemplayer-code
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check formatting
        run: gradle spotlessCheck

      - name: Unit tests
        run: gradle test

      - name: Assemble debug
        run: gradle :app:assembleDebug

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
